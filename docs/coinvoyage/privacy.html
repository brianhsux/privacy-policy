    // 把文字中的網址與信箱轉成連結
    function appendLinkified(parent, text) {
      const pattern = /(https?:\/\/[^\s）)]+|[\w.+-]+@[\w-]+\.[\w.-]+)/g;
      let last = 0;
      let match;
      while ((match = pattern.exec(text)) !== null) {
        parent.appendChild(document.createTextNode(text.slice(last, match.index)));
        const a = document.createElement('a');
        const value = match[0];
        a.href = value.includes('@') && !value.startsWith('http') ? 'mailto:' + value : value;
        a.textContent = value;
        parent.appendChild(a);
        last = match.index + value.length;
      }
      parent.appendChild(document.createTextNode(text.slice(last)));
    }

    function changeLanguage() {
      const lang = document.getElementById('language').value;
      const t = translations[lang];
      document.getElementById('title').textContent = t.title;
      document.getElementById('effective').textContent = t.effective;
      document.getElementById('intro').textContent = t.intro;

      const container = document.getElementById('sections');
      container.innerHTML = '';
      t.sections.forEach(section => {
        const h2 = document.createElement('h2');
        h2.textContent = section.title;
        container.appendChild(h2);
        const ul = document.createElement('ul');
        section.items.forEach(item => {
          const li = document.createElement('li');
          appendLinkified(li, item);
          ul.appendChild(li);
        });
        container.appendChild(ul);
      });

      document.documentElement.lang = lang;
    }

    // 預設語言：網址參數 ?lang= 優先，否則依瀏覽器語言
    function initialLanguage() {
      const param = new URLSearchParams(location.search).get('lang');
      if (param && translations[param]) return param;
      const nav = (navigator.language || '').toLowerCase();
      if (nav.startsWith('zh')) {
        return /(cn|sg|hans)/.test(nav) ? 'zh-Hans' : 'zh-Hant';
      }
      return nav ? 'en' : 'zh-Hant';
    }

    document.getElementById('language').value = initialLanguage();
